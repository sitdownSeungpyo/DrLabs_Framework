# Host tests on the three development platforms, and a build for the robot
# target.  macos-latest is an Apple Silicon runner, so the aarch64-apple-darwin
# serial and scheduling paths are exercised, not just type-checked. Nothing
# here touches hardware; the bench numbers in docs/ come from a person at the
# bench.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      # One platform failing should not hide what the others would have said.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee test.log; then
            # Put the failure on the Checks tab as one annotation, readable
            # without auth: the `failures:` block when a test failed, the
            # compiler/build-script errors when the build did, and the log
            # tail either way. dtolnay/rust-toolchain sets
            # CARGO_TERM_COLOR=always, so the ANSI codes are stripped first.
            python3 - <<'PY'
            import re
            log = open("test.log", encoding="utf-8", errors="replace").read()
            log = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", log).replace("\r", "")
            lines = log.split("\n")
            out = []
            if "failures:" in lines:
                i = lines.index("failures:")
                out += ["== failures =="] + [l for l in lines[i:i + 80] if l]
            errs = [n for n, l in enumerate(lines)
                    if re.match(r"^(error|warning: build failed|CMake Error|  --- stderr)", l)]
            for n in errs[:6]:
                out += ["== %s ==" % lines[n][:80]] + lines[n:n + 14]
            out += ["== last 40 lines =="] + lines[-40:]
            text = "\n".join(out)[-3800:]
            print("::error::" + text.replace("%", "%25").replace("\n", "%0A"))
            PY
            exit 1
          fi

  aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: cargo install cargo-zigbuild
      # v1 of this action is retired and its default (a nightly zig) no longer
      # resolves. Pinned to a release so a new zig cannot break the job on its
      # own; move it together with cargo-zigbuild.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: cargo zigbuild --workspace --target aarch64-unknown-linux-gnu --profile rt
      - uses: actions/upload-artifact@v5
        with:
          name: drlabs-aarch64-linux
          path: target/aarch64-unknown-linux-gnu/rt/drlabs
