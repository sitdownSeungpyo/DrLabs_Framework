# Host tests on the three development platforms, and a build for the robot
# target.  macos-latest is an Apple Silicon runner, so the aarch64-apple-darwin
# serial and scheduling paths are exercised, not just type-checked. Nothing
# here touches hardware; the bench numbers in docs/ come from a person at the
# bench.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      # One platform failing should not hide what the others would have said.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: cargo install cargo-zigbuild
      # v1 of this action is retired and its default (a nightly zig) no longer
      # resolves. Pinned to a release so a new zig cannot break the job on its
      # own; move it together with cargo-zigbuild.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: cargo zigbuild --workspace --target aarch64-unknown-linux-gnu --profile rt
      - uses: actions/upload-artifact@v4
        with:
          name: drlabs-aarch64-linux
          path: target/aarch64-unknown-linux-gnu/rt/drlabs
