[workspace]
resolver = "2"

# Crates join this list as they are written and their tests pass.  The full
# layout is in docs/RUST.md; nothing is listed here until it builds.
members = [
    "apps/drlabs-cli",
    "crates/drlabs-core",
    "crates/drlabs-robot",
    "crates/drlabs-rt",
    "crates/drlabs-safety",
    "crates/drlabs-sim",
    "crates/drlabs-session",
    "crates/drlabs-timing",
    "crates/drlabs-transport",
    "crates/drivers/drlabs-dynamixel",
    "crates/drivers/drlabs-moteus",
    "crates/drivers/drlabs-odrive",
    "crates/drivers/drlabs-robstride",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/sitdownSeungpyo/DrLabs_Framework"

[workspace.dependencies]
drlabs-core = { path = "crates/drlabs-core" }
drlabs-robot = { path = "crates/drlabs-robot" }
drlabs-rt = { path = "crates/drlabs-rt" }
drlabs-safety = { path = "crates/drlabs-safety" }
drlabs-sim = { path = "crates/drlabs-sim" }
drlabs-session = { path = "crates/drlabs-session" }
drlabs-timing = { path = "crates/drlabs-timing" }
drlabs-transport = { path = "crates/drlabs-transport" }
drlabs-dynamixel = { path = "crates/drivers/drlabs-dynamixel" }
drlabs-moteus = { path = "crates/drivers/drlabs-moteus" }
drlabs-odrive = { path = "crates/drivers/drlabs-odrive" }
drlabs-robstride = { path = "crates/drivers/drlabs-robstride" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# The machine ships as one file.  Optimise for that: one codegen unit, fat LTO,
# and panics that abort rather than unwind -- there is nothing above a control
# loop to catch an unwind and carry on sensibly.
#
# Symbols are kept (debug = 1 is line tables only) so a crash on a robot PC
# leaves a backtrace worth reading; the `rt` profile below strips them for
# the copy that ships.  Per-target CPU tuning lives in .cargo/config.toml.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
strip = false

# What goes on the robot: release, stripped.  `cargo build --profile rt`.
[profile.rt]
inherits = "release"
strip = true
debug = 0
